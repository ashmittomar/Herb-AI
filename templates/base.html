<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#f5f7f2">

    <title>{% block title %}Herb-AI{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    {% block head %}{% endblock %}

</head>

<body>

    <header class="navbar">

        <div class="nav-container">

            <a href="{{ url_for('home') }}" class="logo">
                <i class="fas fa-leaf"></i>
                Herb-AI
            </a>

            <nav class="nav-links">

                <a href="{{ url_for('home') }}" class="{% if page == 'Home' %}active{% endif %}">
                    Home
                </a>

                <a href="{{ url_for('plant_explorer') }}" class="{% if page == 'Plant Explorer' %}active{% endif %}">
                    Plant Explorer
                </a>

                <a href="{{ url_for('plant_intelligence') }}"
                    class="{% if page == 'Plant Intelligence' %}active{% endif %}">
                    Plant Intelligence
                </a>

                <a href="{{ url_for('traditional_knowledge') }}"
                    class="{% if page == 'Traditional Knowledge AI' %}active{% endif %}">
                    Knowledge AI
                </a>

                <a href="{{ url_for('research') }}" class="{% if page == 'Research' %}active{% endif %}">
                    Research
                </a>

                <a href="{{ url_for('analytics') }}" class="{% if page == 'Analytics' %}active{% endif %}">
                    Analytics
                </a>

            </nav>

        </div>

    </header>

    <main>

        {% block content %}{% endblock %}

    </main>

    <footer class="footer">

        <div class="footer-inner">

            <div class="footer-brand">

                <h3>
                    <i class="fas fa-leaf"></i>
                    Herb-AI
                </h3>

                <p>
                    Connecting traditional herbal knowledge
                    with modern technology.
                </p>

            </div>

            <div class="footer-bottom">

                <p>
                    Developed by <strong>Ashmit Tomar</strong>
                    | © 2026 Herb-AI. All rights reserved.
                </p>

            </div>

        </div>

    </footer>

    <script src="{{ url_for('static', filename='script.js') }}" defer></script>

</body>

</html>
